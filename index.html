<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แบบประเมินคุณภาพการพยาบาลภายใน เตรียมรับรอง NQA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F4;--surface:#FFFFFF;--ink:#16253A;--muted:#5A6B7D;--line:#D6DFE6;--teal:#0E6A70;--teal-soft:#DCEFEF;--pass:#2B7A4B;--pass-soft:#E1F1E6;--warn:#A86E12;--warn-soft:#FBF0DC;--fail:#AE3B36;--fail-soft:#F8E3E1;--gold:#9C7A22;--plus:#5B6FB0;--grey:#8C9AA7;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1923;--surface:#17242F;--ink:#E4ECF2;--muted:#9AABBA;--line:#2A3A48;--teal:#4FB7BC;--teal-soft:#183A3E;--pass:#5CC08A;--pass-soft:#16332A;--warn:#E0A64A;--warn-soft:#3A2D16;--fail:#E8807A;--fail-soft:#3E1F1F;--gold:#D9B65A;--plus:#93A5E6;--grey:#5E6D7B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1923;--surface:#17242F;--ink:#E4ECF2;--muted:#9AABBA;--line:#2A3A48;--teal:#4FB7BC;--teal-soft:#183A3E;--pass:#5CC08A;--pass-soft:#16332A;--warn:#E0A64A;--warn-soft:#3A2D16;--fail:#E8807A;--fail-soft:#3E1F1F;--gold:#D9B65A;--plus:#93A5E6;--grey:#5E6D7B;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;line-height:1.3;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:7px 12px;border-radius:7px;color:var(--muted);font-weight:500;cursor:pointer}
.nav button[aria-current="page"]{background:var(--teal-soft);color:var(--teal)}
main{max-width:980px;margin:0 auto;padding:22px 20px 110px}
h1{font-size:24px;line-height:1.35;margin:0 0 6px}
h2{font-size:19px;line-height:1.4;margin:0 0 6px}
h3{font-size:16px;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 18px;max-width:70ch}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.stack>*+*{margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);font-weight:500}
.btn.sm{padding:5px 11px;font-size:13.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label.f{display:block;font-size:13.5px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:60px;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.chip.pass{background:var(--pass-soft);color:var(--pass)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.fail{background:var(--fail-soft);color:var(--fail)}.chip.na{background:var(--bg);color:var(--muted);border:1px solid var(--line)}.chip.go{background:var(--teal-soft);color:var(--teal)}
.mode{font-size:12px;color:var(--muted)}
/* home */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.steps{margin:0;padding-left:22px;color:var(--muted)}
.steps li{margin:4px 0}
.steps b{color:var(--ink)}
.results{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:420px;overflow-y:auto}
.ritem{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 12px;cursor:pointer}
.ritem:last-child{border-bottom:0}
.ritem:hover{background:var(--teal-soft)}
.ritem .path{font-size:12.5px;color:var(--muted);display:block}
.ghead{padding:8px 12px;background:var(--bg);font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
/* assess */
.crumb{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.crumb button{border:0;background:none;color:var(--teal);padding:0;cursor:pointer;font-size:inherit}
.stepbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;margin-bottom:8px}
.stepbar button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13.5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.stepbar button[aria-current="step"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stepbar button:disabled{opacity:.45;cursor:not-allowed}
.stepbar .ok{color:var(--pass);font-weight:700}
.stepbar button[aria-current="step"] .ok{color:inherit}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
.howto summary{padding:12px 18px;cursor:pointer;font-weight:600}
.howto .in{padding:0 18px 16px}
.lvtable{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.lvtable b{white-space:nowrap}
.tips{margin:12px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.topic{margin-top:26px}
.topic-h{border-left:4px solid var(--teal);padding:2px 0 2px 12px;margin-bottom:12px}
.topic-h h3{margin:0;font-size:17px}
.topic-h p{margin:0;color:var(--muted);font-size:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.q.missing{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
.q .qn{font-size:12.5px;color:var(--muted);font-weight:600}
.q .qt{margin:2px 0 4px;font-weight:600;font-size:15.5px}
.q .ex{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:700px){.ladder{grid-template-columns:repeat(3,1fr)}}
.ladder button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 6px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;text-align:center}
.ladder button:hover{border-color:var(--teal)}
.ladder .bars{display:flex;align-items:flex-end;gap:2px;height:20px}
.ladder .bars i{width:5px;background:var(--line);border-radius:1px}
.ladder .bars i.on{background:var(--teal)}
.ladder b{font-size:16px;line-height:1}
.ladder span{font-size:12px;line-height:1.3;color:var(--muted)}
.ladder button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.ladder button[aria-pressed="true"] span{color:#fff}
.ladder button[aria-pressed="true"] .bars i{background:rgba(255,255,255,.35)}
.ladder button[aria-pressed="true"] .bars i.on{background:#fff}
.chosen{font-size:13.5px;margin-top:8px;color:var(--teal);min-height:1.4em}
.q details{margin-top:8px}
.q details summary{font-size:13.5px;color:var(--muted);cursor:pointer}
.q details textarea{margin-top:6px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:980px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dock .meta{flex:1;min-width:200px}
.dock .meta div{font-size:13.5px;color:var(--muted);margin-bottom:4px}
/* summary */
.catsum{margin-top:28px;border:2px solid var(--teal);border-radius:14px;background:var(--surface);padding:20px}
.bigscore{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.bigscore .n{font-size:56px;font-weight:700;line-height:.9;letter-spacing:-2px}
.bigscore .n small{font-size:18px;color:var(--muted);letter-spacing:0;font-weight:500}
.bigscore .t{font-size:19px;font-weight:700}
.bigscore .t small{display:block;font-size:13.5px;color:var(--muted);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--teal)}
.bar i.lo{background:var(--fail)}.bar i.mid{background:var(--warn)}
.scroll{overflow-x:auto}
.ruler{position:relative;height:42px;display:flex;border-radius:7px;overflow:hidden}
.ruler div{display:flex;align-items:flex-end;padding:0 8px 5px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.ruler .b1{background:var(--grey)}.ruler .b2{background:var(--teal)}.ruler .b3{background:var(--plus)}.ruler .b4{background:var(--gold)}
.ticks{position:relative;height:20px;font-size:11.5px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);top:3px}
.marker{position:absolute;top:-10px;bottom:-6px;width:3px;background:var(--ink)}
.marker::before{content:"";position:absolute;top:-2px;left:-5px;border:6.5px solid transparent;border-top-color:var(--ink)}
.marker.alt{background:none;border-left:2px dashed var(--ink);opacity:.55;width:0}
.marker.alt::before{display:none}
.rec{border-radius:12px;padding:16px 18px;border:1px solid}
.rec.pass{background:var(--pass-soft);border-color:var(--pass)}.rec.warn{background:var(--warn-soft);border-color:var(--warn)}.rec.fail{background:var(--fail-soft);border-color:var(--fail)}
.rec h3{margin:0 0 6px;font-size:18px}
.rec ul{margin:6px 0 0;padding-left:20px}
.note{font-size:12.5px;color:var(--muted)}
.tierlist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:700px){.tierlist{grid-template-columns:repeat(2,1fr)}}
.tierlist div{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--muted)}
.tierlist div.here{border:2px solid var(--ink);color:var(--ink)}
.tierlist b{display:block;color:var(--ink);font-size:14px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
/* admin */
.agroup{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface)}
.aunit{display:grid;grid-template-columns:1fr 220px auto;gap:8px;margin-top:8px}
@media (max-width:640px){.aunit{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:8px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media print{header.top,.dock,.noprint{display:none!important}body{background:#fff}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
/* v3 additions */
.official{font-weight:600;font-size:15.5px;margin:2px 0 6px}
.plain{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:14px;margin:0 0 6px}
.plain b{color:var(--teal)}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 14px;cursor:pointer;background:var(--surface)}
.radios label:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.heat{border-collapse:separate;border-spacing:3px;font-size:13.5px}
.heat th{text-align:center;padding:6px 4px}
.heat th:first-child{text-align:left}
.heat td{padding:8px 6px;border:0;border-radius:6px;text-align:center}
.heat td.name{text-align:left;background:none;padding-left:0}
.heat td.name button{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-weight:600}
.heat td.name button:hover{color:var(--teal)}
.heat tr.sub td.name{padding-left:22px}
.heat tr.sub td.name button{font-weight:500}
.heat td.name button.exp{border:1px solid var(--line);background:var(--surface);border-radius:5px;width:22px;height:22px;line-height:1;cursor:pointer;margin-right:6px;font-size:13px;padding:0}
.h-na{background:var(--bg);color:var(--muted)}
.h-0{background:var(--fail-soft);color:var(--fail)}
.h-1{background:var(--warn-soft);color:var(--warn)}
.h-2{background:var(--teal-soft);color:var(--teal)}
.h-3{background:var(--pass-soft);color:var(--pass);font-weight:600}
.legend-h{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend-h span{display:inline-flex;gap:5px;align-items:center}
.legend-h i{width:14px;height:14px;border-radius:3px;display:inline-block}
.cascade{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-bottom:16px}
.cascade .lvl{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.cascade .lvl .k{font-size:12.5px;color:var(--muted)}
.cascade .lvl .v{font-size:30px;font-weight:700;line-height:1.1}
.cascade .arrow{align-self:center;color:var(--muted);font-size:20px}
@media (max-width:700px){.cascade .arrow{display:none}}
.tierplan{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;background:var(--surface)}
.tierplan h4{margin:0 0 4px;font-size:15.5px}
.tierplan ol{margin:8px 0 0;padding-left:20px}
.tierplan li{margin:6px 0}
.tierplan li small{display:block;color:var(--muted)}
.reached{border-color:var(--pass);background:var(--pass-soft)}
.subs{font-size:13px;color:var(--muted)}
.subs button{border:0;background:none;color:var(--teal);cursor:pointer;padding:0;font-size:inherit}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--muted)}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}main{padding:0;max-width:none}.box,.tierplan{break-inside:avoid}details.howto{display:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><button class="brand" data-nav="home">ประเมินคุณภาพการพยาบาลภายใน (NQA)<small id="mode">กำลังโหลด</small></button><nav class="nav" id="nav"></nav></div></header>
<main id="app"></main>
<div class="dock" id="dock" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ================= ตั้งค่า =================
   API_URL : วาง URL ของ Google Apps Script Web App (ลงท้ายด้วย /exec)
             ถ้าเว้นว่าง ระบบจะทำงานแบบทดลอง เก็บข้อมูลในเบราว์เซอร์เท่านั้น
   SYNC_MS : ระยะเวลารอก่อนส่งคำตอบขึ้นฐานข้อมูล (มิลลิวินาที)
   ============================================ */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbyFLJdGbUJFRweNPcWwCE046HfdO7mYXiQi9_UZ6_guqZuKM1v-YWJVQqW2VAHVO9Mo/exec",

ตรียมบุคลากรพยาบาลให้พร้อมรับ การเปลี่ยนแปลง ความต้องการด้านขีดความสามารถ และอัตรากำลัง ความต้องการของบุคลากรและความต้องการขององค์กร เพื่อให้บรรลุเป้าหมายขององค์กร และทำให้บุคลากรมั่นใจในการดำเนินการได้อย่างต่อเนื่อง และลดผลกระทบจากการขาดแคลนอัตรากำลัง", "q": "มีการเตรียมรับการเปลี่ยนแปลงกำลังคน และลดผลกระทบเมื่อขาดแคลนบุคลากรหรือไม่", "ex": "แผนรองรับการขาดแคลน ระบบพยาบาลหมุนเวียน", "p": 5}]}, {"c": "5.2", "n": "วัฒนธรรมองค์กร และการขับเคลื่อนความผูกพัน", "max": 15, "intro": "อะไรทำให้บุคลากรรักงานและองค์กร", "items": [{"t": "กำหนดปัจจัยที่มีผลต่อความผูกพัน และความพึงพอใจของบุคลากรแต่ละกลุ่ม และแต่ละระดับ", "q": "มีการค้นหาว่าปัจจัยใดทำให้บุคลากรแต่ละกลุ่มผูกพันและพึงพอใจหรือไม่", "ex": "การสำรวจหรือสนทนากลุ่ม แยกตามช่วงอายุหรือตำแหน่ง", "p": 5}, {"t": "มีการดำเนินการเพื่อตอบสนองต่อปัจจัยที่มีผลต่อ ความผูกพันและความพึงพอใจของบุคลากรแต่ละกลุ่ม และแต่ละระดับ", "q": "มีการดำเนินการตอบสนองปัจจัยเหล่านั้นหรือไม่", "ex": "โครงการที่ทำตามผลสำรวจ", "p": 5}, {"t": "มีการเสริมสร้างวัฒนธรรมองค์กรที่ทำให้เกิดการสื่อสารที่เปิดกว้าง ร่วมแสดงความคิดเห็น พร้อมทั้งกระตุ้นการสร้างผลงาน", "q": "มีวัฒนธรรมการสื่อสารที่เปิดกว้าง ให้บุคลากรร่วมแสดงความคิดเห็น และกระตุ้นให้สร้างผลงานหรือไม่", "ex": "เวทีพูดคุย วัฒนธรรมไม่กล่าวโทษ", "p": 5}]}, {"c": "5.3", "n": "การประเมินความผูกพันของบุคลากร", "max": 14, "intro": "การวัดและใช้ผลความผูกพัน", "items": [{"t": "มีการประเมินความผูกพันและความพึงพอใจของบุคลากร ด้วยวิธีการที่เป็นทางการและไม่เป็นทางการที่เหมาะสมกับบุคลากรพยาบาลแต่ละกลุ่ม", "q": "มีการวัดความผูกพันและความพึงพอใจของบุคลากร ทั้งแบบทางการและไม่เป็นทางการหรือไม่", "ex": "ผลสำรวจประจำปี", "p": 5}, {"t": "นำผลการประเมินความผูกพันและความพึงพอใจของบุคลากรพยาบาลไปใช้ในการปรับปรุงความผูกพันของบุคลากร", "q": "นำผลการวัดไปปรับปรุงความผูกพันของบุคลากรหรือไม่", "ex": "แผนปรับปรุงจากผลสำรวจ", "p": 5}, {"t": "นำผลการประเมินความผูกพันของบุคลากรพยาบาลไปเชื่อมโยงกับผลลัพธ์ของการบริการพยาบาล เพื่อค้นหา โอกาสในการปรับปรุงทั้งความผูกพันของบุคลากรพยาบาล และผลลัพธ์ของการบริการพยาบาล", "q": "เชื่อมโยงความผูกพันของบุคลากรกับผลลัพธ์การพยาบาลหรือไม่", "ex": "การวิเคราะห์ว่าหน่วยงานที่ผูกพันต่ำมีอุบัติการณ์มากกว่าหรือไม่", "p": 4}]}, {"c": "5.4", "n": "การจัดการผลการปฏิบัติงาน", "max": 14, "intro": "การประเมินผลงานและการให้รางวัล", "items": [{"t": "มีระบบประเมินผลงานบุคลากรพยาบาลที่สนับสนุนให้เกิดการทำงานที่ให้ผลการดำเนินการที่ดี บุคลากรมีความผูกพัน และสนับสนุนการมุ่งเน้นผู้ใช้บริการ (ระบบดังกล่าวนำประเด็นเรื่องการบริหารค่าตอบแทน การให้รางวัล การยกย่องชมเชย และการสร้าง แรงจูงใจ มาพิจารณาด้วย)", "q": "ระบบประเมินผลงานส่งเสริมการทำงานดีและเน้นผู้ป่วย โดยผูกกับค่าตอบแทน รางวัล และการยกย่องหรือไม่", "ex": "เกณฑ์ประเมินผลงาน ตัวชี้วัดรายบุคคล", "p": 5}, {"t": "มีการจัดระบบการทำงานเพื่อให้งานขององค์กรบรรลุ ผลสำเร็จ และใช้ประโยชน์อย่างเต็มที่จากสมรรถนะ หลักขององค์กร", "q": "จัดระบบงานให้งานสำเร็จ และใช้ความเชี่ยวชาญขององค์กรได้เต็มที่หรือไม่", "ex": "การจัดทีม ระบบมอบหมายงาน", "p": 5}, {"t": "มีการนำผลการประเมินผลงานของบุคลากรพยาบาล มาพิจารณา เพื่อวิเคราะห์หาโอกาสในการเพิ่มขีดความสามารถขององค์กรพยาบาลและบุคลากรพยาบาล", "q": "นำผลประเมินผลงานมาวิเคราะห์เพื่อพัฒนาความสามารถของบุคลากรและองค์กรหรือไม่", "ex": "สรุปจุดที่ต้องพัฒนาจากผลประเมิน", "p": 4}]}, {"c": "5.5", "n": "การพัฒนาบุคลากรพยาบาลและผู้บริหารการพยาบาล", "max": 14, "intro": "การพัฒนาความรู้และเส้นทางอาชีพ", "items": [{"t": "มีระบบการพัฒนาและเรียนรู้สำหรับบุคลากรพยาบาล ทุกระดับ ทั้งระดับบริหารและระดับปฏิบัติการครอบคลุม ความจำเป็น และความต้องการในการเรียนรู้ และพัฒนาในระดับองค์กรพยาบาลและระดับ บุคคล โดยพิจารณาถึงสมรรถนะหลักขององค์กร ความท้าทายเชิงกลยุทธ์ การบรรลุ แผนปฏิบัติการ การปรับปรุงผลงานขององค์กร การเปลี่ยนแปลง และนวัตกรรม", "q": "มีแผนพัฒนาบุคลากรทุกระดับ ตามความจำเป็นขององค์กรและของแต่ละคนหรือไม่", "ex": "การสำรวจความต้องการอบรม แผนพัฒนารายบุคคล", "p": 5}, {"t": "มีการประเมินประสิทธิผลของระบบการพัฒนาและเรียนรู้สำหรับบุคลากรทางการพยาบาลและผู้นำโดยพิจารณาผลการปฏิบัติงานของแต่ละบุคคลและผลงานขององค์กร", "q": "มีการประเมินว่าการอบรมพัฒนาได้ผลจริงหรือไม่", "ex": "การประเมินหลังอบรม การติดตามการนำไปใช้", "p": 5}, {"t": "มีการจัดการเรื่องความก้าวหน้าในอาชีพของบุคลากร พยาบาลทุกคนอย่างมีประสิทธิผลมีการวางแผนสร้าง ผู้บริหารและผู้นำเพื่อการสืบทอดตำแหน่งอย่างมีประสิทธิผล", "q": "มีการวางเส้นทางความก้าวหน้า และเตรียมผู้สืบทอดตำแหน่งหัวหน้าหรือไม่", "ex": "แผนสืบทอดตำแหน่ง เส้นทางความก้าวหน้า", "p": 4}]}, {"c": "5.6", "n": "บรรยากาศในการทำงาน", "max": 14, "intro": "ความปลอดภัยและสวัสดิการในที่ทำงาน", "items": [{"t": "สร้างความมั่นใจ และดำเนินการปรับปรุงเพื่อให้สถานที่ทำงานเอื้อต่อการมีสุขภาพดี ปลอดภัยและมีการป้องกันภัย", "q": "ที่ทำงานปลอดภัยและเอื้อต่อสุขภาพ และมีการปรับปรุงอย่างต่อเนื่องหรือไม่", "ex": "การสำรวจความเสี่ยงของสถานที่ทำงาน", "p": 5}, {"t": "มีการกำหนดตัววัดผลงานและเป้าหมายการปรับปรุง สำหรับการสร้างบรรยากาศที่ดีในการทำงาน", "q": "มีตัวชี้วัดและเป้าหมายเรื่องบรรยากาศการทำงานหรือไม่", "ex": "ตัวชี้วัดความพึงพอใจต่อสภาพแวดล้อมการทำงาน", "p": 5}, {"t": "ให้การดูแลและเกื้อหนุนบุคลากรด้วยนโยบาย การจัด บริการ และสิทธิประโยชน์ซึ่งปรับให้เหมาะสมกับความต้องการของบุคลากรที่มีความหลากหลายในทุกกลุ่ม", "q": "สวัสดิการและสิทธิประโยชน์เหมาะกับความต้องการที่หลากหลายของบุคลากรหรือไม่", "ex": "บ้านพัก การจัดเวรยืดหยุ่น สวัสดิการต่าง ๆ", "p": 4}]}, {"c": "5.7", "n": "สุขภาพของบุคลากร", "max": 14, "intro": "การดูแลสุขภาพและความเสี่ยงจากการทำงาน", "items": [{"t": "มีนโยบายและวิธีปฏิบัติในการคุ้มครองสุขภาพ และความปลอดภัยของบุคลากร มีการประเมิน และจัดการ ความเสี่ยงต่อสุขภาพที่สำคัญอย่างเป็นระบบ และต่อเนื่อง (ความเสี่ยงต่อสุขภาพ อาทิ การติดเชื้อวัณโรค ไวรัสตับอักเสบบี และ HIV การเจ็บป่วย หรือบาดเจ็บจากการทำงาน ความรุนแรงก้าวร้าว และการคุกคามทั้งทางร่างกาย และจิตใจ)", "q": "มีนโยบายป้องกันความเสี่ยงสุขภาพจากงาน เช่น วัณโรค ไวรัสตับอักเสบบี HIV เข็มตำ และการถูกทำร้ายหรือไม่", "ex": "แนวทางเมื่อถูกเข็มตำ ระบบรายงานการถูกทำร้าย", "p": 5}, {"t": "บุคลากรพยาบาลทุกคนมีส่วนร่วม เรียนรู้ ตัดสินใจ และปฏิบัติในการดูแลสุขภาพของตนเอง รวมทั้งมีข้อตกลง ร่วมกันในการเป็นแบบอย่างพฤติกรรมสุขภาพที่ดี และมีวัฒนธรรมองค์กรในการสร้างเสริมสุขภาพ", "q": "บุคลากรมีส่วนร่วมดูแลสุขภาพตนเอง และมีวัฒนธรรมสร้างเสริมสุขภาพหรือไม่ ": "ดำเนินการตามแผนจนผู้ป่วยดูแลตนเองได้หรือไม่", "ex": "การประเมินความพร้อมก่อนกลับบ้าน", "p": 5}, {"t": "มีระบบการติดตาม กำกับ ประเมินผล และสนับสนุนให้ผู้ใช้บริการ และครอบครัวสามารถดูแลสุขภาพตนเอง และดูแลกันเองได้", "q": "มีการติดตามหลังกลับบ้านว่าผู้ป่วยและครอบครัวดูแลตนเองได้หรือไม่", "ex": "การโทรติดตาม การเยี่ยมบ้าน", "p": 5}]}, {"c": "6.12", "n": "การบันทึกการพยาบาล", "max": 16, "intro": "คุณภาพของบันทึกทางการพยาบาล", "items": [{"t": "มีการบันทึกการพยาบาลโดยใช้หลักกระบวนการพยาบาลตามมาตรฐานการดูแลเฉพาะภาวะการเจ็บป่วยที่ครอบคลุม ปัญหาและความต้องการของผู้ใช้บริการ", "q": "บันทึกการพยาบาลตามกระบวนการพยาบาล ครอบคลุมปัญหาและความต้องการของผู้ป่วยหรือไม่", "ex": "ผลการตรวจสอบคุณภาพบันทึก", "p": 6}, {"t": "มีการนำข้อมูลจากการบันทึกการพยาบาลไปใช้ในการวางแผนการดูแลต่อเนื่อง และพัฒนาเทคนิคการปฏิบัติ การพยาบาล", "q": "นำข้อมูลจากบันทึกไปวางแผนการดูแลต่อเนื่องและพัฒนาการพยาบาลหรือไม่", "ex": "การใช้บันทึกในการส่งเวรและส่งต่อ", "p": 5}, {"t": "มีการบันทึกการพยาบาลมีความถูกต้องตามมาตรฐาน และเป็นหลักฐานตามกฎหมายได้", "q": "บันทึกถูกต้องตามมาตรฐาน และใช้เป็นหลักฐานทางกฎหมายได้หรือไม่", "ex": "ผลตรวจคุณภาพเวชระเบียน", "p": 5}]}]}, {"k": 7, "name": "ผลลัพธ์ทางการพยาบาล", "max": 400, "results": true, "topics": [{"c": "7.1", "n": "ผลลัพธ์ด้านการบริการพยาบาล", "max": 80, "intro": "ดูความปลอดภัยและการฟื้นหายของผู้ป่วย ตัวอย่างตัวชี้วัด: อัตราพลัดตกหกล้ม แผลกดทับ การติดเชื้อในโรงพยาบาล ความคลาดเคลื่อนทางยา กลับมารักษาซ้ำใน 28 วัน", "items": [{"t": "แสดงระดับปัจจุบันและแนวโน้มของตัวชี้วัดที่สำคัญ ทั้งในด้านผลลัพธ์ กระบวนการความปลอดภัยสภาพการฟื้นหายของผู้ป่วย และระดับความสามารถในการดูแล ตนเองของผู้ใช้บริการ", "q": "มีข้อมูลตัวชี้วัดสำคัญของด้านนี้ ทั้งค่าปัจจุบันและข้อมูลย้อนหลังอย่างน้อย 3 ปีหรือไม่", "ex": "กราฟหรือตารางตัวชี้วัด 3 ปี: อัตราพลัดตกหกล้ม แผลกดทับ การติดเชื้อในโรงพยาบาล ความคลาดเคลื่อนทางยา กลับมารักษาซ้ำใน 28 วัน", "p": 20}, {"t": "แสดงค่าของตัวชี้วัดที่บรรลุเป้าหมาย และมีแนวโน้มที่ดีขึ้นอย่างต่อเนื่อง และตอบสนองวัตถุประสงค์เชิงกลยุทธ์ขององค์กร", "q": "ตัวชี้วัดเหล่านั function meanLevels(list){const out=new Array(NI).fill(null);if(!list.length)return out;for(let i=0;i<NI;i++){let s=0,n=0;list.forEach(l=>{if(l[i]!=null){s+=l[i];n++}});out[i]=n?s/n:null}return out}

const C6=[CAT_START[5],CAT_START[5]+CATS[5].topics.length*3];
/* บทที่ 3: คะแนนรวม = หมวด 1–5 และหมวด 7 (ประเมินระดับองค์กร) + คะแนนเฉลี่ยหมวด 6 ของทุกกลุ่มงาน/งาน */
function combine(top,six){if(top&&six){const o=top.slice();for(let i=C6[0];i<C6[1];i++)o[i]=six[i];return o}return top||six||null}
function buildTree0(h){const done=Object.entries(DOCS).filter(([id,d])=>d&&d.status==="done"&&d.answers&&d.target&&hospOf(d)===h).map(([id,d])=>({id,...d}));

 const depts=structFor(h).map(dp=>{const us=dp.units.map(u=>{const subs=units[dp.code+"|"+u.code]||[];const lv=subs.length?meanLevels(subs.map(s=>s.answers)):null;return{u,subs,lv,R:lv?compute(lv):null}});
  const own=deptOwn[dp.code]||[];const ownLv=own.length?meanLevels(own.map(s=>s.answers)):null;
  const uL=us.filter(x=>x.lv).map(x=>x.lv);const unitAvg=uL.length?meanLevels(uL):null;
  const lv=combine(ownLv,unitAvg);return{d:dp,us,own,ownLv,lv,R:lv?compute(lv):null,covered:uL.length}});
 const dl=depts.filter(x=>x.lv);const deptAvg=dl.length?meanLevels(dl.map(x=>x.lv)):null;
 const divLv=divOwn.length?meanLevels(divOwn.map(s=>s.answers)):null;
 const lv=combine(divLv,deptAvg);
 return{h,depts,lv,R:lv?compute(lv):null,formula:!!(divLv&&deptAvg),divOwn,divLv,divR:divLv?compute(divLv):null,avgR:deptAvg?compute(deptAvg):null,nDone:done.length}}

function recPlan(R){const base=R.total;const cands=R.topics.map(tp=>{const target=tp.avgL!=null&&tp.avgL>=4?5:4;const gain=tp.max*Math.max(0,target-(tp.avgL??0))/5;return{tp,target,gain}}).filter(x=>x.gain>0.05).sort((a,b)=>b.gain-a.gain);
 let k=0,acc=0;return GOALS.map(g=>{if(base>=g.t)return{g,reached:true};const need=g.t-base;const pick=[];while(acc<need&&k<cands.length){pick.push(cands[k]);acc+=cands[k].gain;k++}return{g,need,pick,acc,enough:acc>=need}})}
function adviceFor(tp){const lvl=Math.max(0,Math.min(5,Math.floor((tp.avgL??0)+0.0001)));return(tp.results?NEXT_RES:NEXT_PROC)[lvl]}
function weakestEx(tp,lv){const ci=tp.ci,ti=tp.ti;let worst=null;tp.t.items.forEach((it,ii)=>{const v=lv[CAT_START[ci]+ti*3+ii];if(worst==null||v<worst.v)worst={v,it}});return worst?worst.it.ex:""}

 const sorted=R.cats.slice().sort((a,b)=>b.pct-a.pct);const weakCats=R.cats.filter(c=>c.pct<50);const topT=R.topics.slice().sort((a,b)=>b.pct-a.pct);

 h+=`${mode==="api"?`<div class="box" style="margin-top:16px"><label class="f" for="adminKey">รหัสผู้ดูแล (ADMIN_KEY ที่ตั้งไว้ใน Apps Script)</label><input type="password" id="adminKey" value="${esc(adminKey())}" style="max-width:320px"></div>`:""}<div class="row" style="margin-top:16px"><button class="btn pri" data-savepts="1" ${ptsValid(ptsDraft)?"":"disabled"} id="savePts">บันทึกตารางคะแนน</button><button class="btn" data-resetpts="1">กลับไปใช้ค่าตั้งต้น</button><span class="note" id="ptsMsg">${ptsValid(ptsDraft)?"":"มีหัวข้อที่ผลรวมไม่ตรงกับคะแนนเต็ม"}</span></div>`;
 $("#app").innerHTML=h}

/* ---------- exports (CSV / PDF) ---------- */
const csvCell=v=>{v=v==null?"":String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCsv=rows=>rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
function dl(name,text){const blob=new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast("ดาวน์โหลด "+name)}
const today=()=>new Date().toISOString().slice(0,10);
const LVLNAME={unit:"หน่วย/หอผู้ป่วย",dept:"งานการพยาบาล",division:"ฝ่ายการพยาบาล"};
function docMeta(id,d){const t=d.target||{};const h=hospOf(d);return[id,d.status==="done"?"ส่งแล้ว":"ร่าง",h,LVLNAME[t.level]||"",t.level==="division"?"":(t.dept||""),t.level==="division"?"ฝ่ายการพยาบาล":deptName(h,t.dept),t.unit||"",t.unit?unitName(h,t.unit):"",d.assessor?.name||"",d.assessor?.position||"",d.date||"",d.updatedAt||""]}
const META_HEAD=["รหัสฉบับ","สถานะ","โรงพยาบาล","ระดับที่ประเมิน","รหัสงาน","งานการพยาบาล","รหัสหน่วย","หน่วย","ผู้ประเมิน","ตำแหน่ง","วันที่ประเมิน","ปรับปรุงล่าสุด"];
const r2=n=>Math.round(n*100)/100;
function exportSummary(){const rows=[[...META_HEAD,"ตอบแล้ว (ข้อ)",...CATS.map(c=>`หมวด ${c.k} (${c.max})`),"คะแนนรวม (1000)","ระดับรางวัล"]];
 Object.entries(DOCS).filter(([,d])=>d.target).forEach(([id,d])=>{const R=compute(d.answers);rows.push([...docMeta(id,d),R.ans,...R.cats.map(c=>r2(c.score)),r2(R.total),R.done?tierOf(R.total).name:"ยังตอบไม่ครบ"])});
 dl(`NQA_สรุปคะแนนรายฉบับ_${today()}.csv`,toCsv(rows))}
function exportAnswers(){const rows=[[...META_HEAD,...FLAT.map(f=>`${f.t.c}(${f.ii+1})`)]];
 Object.entries(DOCS).filter(([,d])=>d.target).forEach(([id,d])=>rows.push([...docMeta(id,d),...d.answers.map(v=>v==null?"":v)]));
 dl(`NQA_คำตอบรายข้อ_${today()}.csv`,toCsv(rows))}
function exportCascade(){const T=buildTree();const head=["โรงพยาบาล","ระดับ","รหัส","ชื่อ","สังกัด","ความครอบคลุม",...CATS.map(c=>`หมวด ${c.k} (%)`),"คะแนนรวม (1000)","ระดับรางวัล"];const rows=[head];
 const line=(lv,code,name,parent,cov,R)=>rows.push([T.h,lv,code,name,parent,cov,...(R?R.cats.map(c=>r2(c.pct)):CATS.map(()=>"")),R?r2(R.total):"",R?tierOf(R.total).name:"ยังไม่มีข้อมูล"]);
 line(T.formula?"ฝ่าย (สูตรบทที่ 3)":"ฝ่าย (เฉลี่ยจากงาน)",DIVCODE,"ฝ่ายการพยาบาล","",`${T.depts.filter(d=>d.lv).length} งาน`,T.R);
 if(T.avgR)line("ฝ่าย (เฉลี่ยจากงานทั้ง 7 หมวด)",DIVCODE,"ฝ่ายการพยาบาล","","",T.avgR);
 T.depts.forEach(x=>{line("งาน",x.d.code,x.d.name,"ฝ่ายการพยาบาล",`${x.covered}/${x.d.units.length} หน่วย`,x.R);x.us.forEach(u=>line("หน่วย/หอผู้ป่วย",u.u.code,u.u.name,x.d.name,`${u.subs.length} ฉบับ`,u.R))});
 dl(`NQA_ผลตามโครงสร้างบริหาร_${today()}.csv`,toCsv(rows))}
let lastReport=null;
function exportReport(){if(!lastReport)return;const {R,title}=lastReport;const rows=[["รายงาน",title],["วันที่ส่งออก",today()],[],["หมวด","คะแนนเต็ม","คะแนนที่ได้","ร้อยละ","ผลการแปล"]];
 R.cats.forEach(c=>rows.push([`หมวด ${c.k} ${c.name}`,c.max,r2(c.score),r2(c.pct),interp(c.pct)[1]]));rows.push(["รวม",1000,r2(R.total),r2(R.total/10),tierOf(R.total).name]);rows.push([]);
 rows.push(["หัวข้อ","คะแนนเต็ม","คะแนนที่ได้","ร้อยละ","ระดับเฉลี่ย (0–5)"]);R.topics.forEach(t=>rows.push([`${t.c} ${t.n}`,t.max,r2(t.score),r2(t.pct),t.avgL==null?"":r2(t.avgL)]));
 dl(`NQA_รายงาน_${title.replace(/[\\/:*?"<>|\s]+/g,"_")}_${today()}.csv`,toCsv(rows))}
function printPdf(){toast("เลือกเครื่องพิมพ์เป็น “บันทึกเป็น PDF / Save as PDF”");setTimeout(()=>window.print(),300)}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.nav){go(d.nav);return}
 if(d.unit&&view==="start"){form.unit=d.unit;$("#unitList").innerHTML=unitList();refreshStart();return}
 if(d.begin){if(!canBegin())return;const id=uid();const tg=formTarget();DOCS[id]={target:tg,assessor:{name:form.name.trim(),position:form.position,affil:tg.dept},date:form.date,answers:new Array(NI).fill(null),notes:{},status:"draft",owner:me,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
  writeDoc(id,DOCS[id],true);cur={id,ci:0};form=null;view="assess";render();scrollTo({top:0});return}
 if(d.cat!=null&&view==="assess"){dirty=true;flush(true);cur.ci=+d.cat;showMissing=false;render();scrollTo({top:0});return}
 if(d.ans!=null){const dc=doc(),i=+d.ans,v=+d.v;dc.answers[i]=dc.answers[i]===v?null:v;
  $$(`button[data-ans="${i}"]`).forEach(x=>{const on=+x.dataset.v===dc.answers[i];x.setAttribute("aria-pressed",on);x.setAttribute("aria-checked",on)});
  const L=CATS[cur.ci].results?RES_LV:PROC_LV;document.getElementById("ch"+i).textContent=dc.answers[i]!=null?"เลือก: "+L[dc.answers[i]][1]:"";if(dc.answers[i]!=null)document.getElementById("q"+i).classList.remove("missing");
  const R=compute(dc.answers);const sb=$$(".stepbar button")[cur.ci];sb.innerHTML=(R.cats[cur.ci].ans===R.cats[cur.ci].n?'<span class="ok">✓</span>':"")+"หมวด "+CATS[cur.ci].k;const cs=$("#catState");if(cs)cs.textContent=R.cats[cur.ci].ans===R.cats[cur.ci].n?"ตอบครบทุกข้อในหมวดนี้แล้ว":"ยังตอบไม่ครบในหมวดนี้";const sub=$("[data-submit]");if(sub&&!$("#dock").contains(sub))sub.disabled=!R.done;
  updateDock();scheduleSave();return}
 if(d.missing){showMissing=true;const dc=doc();let first=null;for(let i=CAT_START[cur.ci];i<CAT_START[cur.ci]+CATS[cur.ci].topics.length*3;i++)if(dc.answers[i]==null){const el=document.getElementById("q"+i);el.classList.add("missing");if(!first)first=el}if(first)first.scrollIntoView({behavior:"smooth",block:"center"});return}
 if(d.submit){const dc=doc();if(!compute(dc.answers).done)return;dc.status="done";dirty=true;flush(true);toast("ส่งแบบประเมินแล้ว");detail={type:"sub",id:cur.id};view="report";render();scrollTo({top:0});return}
 if(d.edit){cur={id:d.edit,ci:0};const R=compute(DOCS[d.edit].answers);const f=R.cats.findIndex(c=>c.ans<c.n);cur.ci=f<0?0:f;view="assess";render();scrollTo({top:0});return}
 if(d.del){if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="กดอีกครั้งเพื่อยืนยัน";b.style.color="var(--fail)";return}await deleteDoc(d.del);render();return}
 if(d.viewsub){detail={type:"sub",id:d.viewsub,h:curHosp};view="report";render();scrollTo({top:0});return}
 if(d.detail){detail={type:d.detail,code:d.code,dept:d.dept,h:curHosp};view="report";render();scrollTo({top:0});return}
 if(d.addhosp){const n=(form.newHosp||"").trim();if(!n){toast("กรุณาพิมพ์ชื่อโรงพยาบาล");return}const l=lsGet(LKEY+"-hosp",[]);if(!l.includes(n)&&n!==RAMA){l.push(n);lsSet(LKEY+"-hosp",l)}form.hospital=n;form.newHosp="";form.dept="";form.unit="";form.deptText="";form.unitText="";renderStart();toast("เพิ่ม "+n+" แล้ว");return}
 if(d.toggle){openDepts[d.toggle]=!openDepts[d.toggle];renderCascade();return}
 if(d.print){printPdf();return}
 if(d.refresh){loadAll();renderCascade();return}
 if(d.exp){({summary:exportSummary,answers:exportAnswers,cascade:exportCascade,report:exportReport})[d.exp]();return}
 if(d.savepts){if(!ptsValid(ptsDraft))return;PTS=ptsDraft.slice();bump();lsSet(LKEY+"-pts",PTS);if(mode==="api"){const k=($("#adminKey")&&$("#adminKey").value.trim())||adminKey();if(!k){toast("กรุณาใส่รหัสผู้ดูแล");return}try{const r=await api("setPoints",{pts:PTS,key:k});if(r.error)throw new Error(r.error);lsSet(LKEY+"-admin",k);toast("บันทึกตารางคะแนนขึ้นฐานข้อมูลแล้ว")}catch(err){toast("บันทึกไม่สำเร็จ: "+err.message)}}else toast("บันทึกตารางคะแนนแล้ว");renderPoints();return}
 if(d.resetpts){ptsDraft=DEFAULT_PTS.slice();renderPoints();return}
});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
 if(d.f&&form){form[d.f]=t.value;if(d.f==="q"){const ul=$("#unitList");if(ul)ul.innerHTML=unitList()}refreshStart();return}
 if(d.pt!=null){const v=parseFloat(t.value);ptsDraft[+d.pt]=isNaN(v)?0:v;const idx=+d.pt,f=FLAT[idx],b=CAT_START[f.ci]+f.ti*3,sum=ptsDraft[b]+ptsDraft[b+1]+ptsDraft[b+2],ok=Math.abs(sum-f.t.max)<1e-9;document.getElementById(`ps${f.ci}-${f.ti}`).innerHTML=ok?sum:`<span class="chip fail">${sum}</span>`;const v2=ptsValid(ptsDraft);$("#savePts").disabled=!v2;$("#ptsMsg").textContent=v2?"":"มีหัวข้อที่ผลรวมไม่ตรงกับคะแนนเต็ม";return}
 if(d.note!=null){const dc=doc();dc.notes=dc.notes||{};dc.notes[d.note]=t.value;scheduleSave();return}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="hsel"){curHosp=t.value;openDepts={};render();return}
 if(t.name==="lvl"&&form){form.level=t.value;form.unit="";form.dept="";form.unitText="";renderStart();return}
 if(t.dataset.f==="hospital"&&form){form.hospital=t.value;form.dept="";form.unit="";form.deptText="";form.unitText="";form.q="";renderStart();return}
 if(t.dataset.f==="deptText"&&form){form.deptText=t.value;const st=structFor(form.hospital);const du=(st.find(d=>d.name===t.value.trim())||{units:[]}).units;const dl=$("#dl-unit");if(dl)dl.innerHTML=du.map(u=>`<option value="${esc(u.name)}">`).join("");refreshStart();return}
 if(t.dataset.f&&form){form[t.dataset.f]=t.value;if(t.dataset.f==="dept"&&form.level==="unit"){form.unit="";const ul=$("#unitList");if(ul)ul.innerHTML=unitList()}refreshStart()}});
window.addEventListener("beforeunload",()=>flush());
loadLocal();render();renderMode();loadPoints();loadAll();
